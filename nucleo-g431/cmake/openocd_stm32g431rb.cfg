# OpenOCD configuration for the STM32G431RBT6 "nucleo-g431" board, debugged
# through an ST-Link (V2/V3) over SWD.
#
# Usage:
#   openocd -f cmake/openocd_stm32g431rb.cfg -c "program app.hex verify reset exit"
#   openocd -f cmake/openocd_stm32g431rb.cfg        # interactive; telnet 4444

source [find interface/stlink.cfg]

# SWD transport.
transport select swd

# Work-area in RAM used for flash programming (STM32G431RBT6: 32 KB SRAM).
set WORKAREASIZE 0x8000
# Let OpenOCD auto-detect the CPU IDCODE instead of pinning one revision.
set CPUTAPID 0

source [find target/stm32g4x.cfg]

adapter speed 4000
